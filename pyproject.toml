[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsp-toolkit"
dynamic = ["version"]
description = "WSP Bench: let AI agents read, debug and edit neural-network weights directly. MCP server, web UI, auto-scored challenges, public leaderboard and animated replays."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "encore488" }]
keywords = ["weight-space programming", "interpretability", "mechanistic interpretability", "benchmark", "AI agents",
            "MCP", "model editing", "neural networks", "Claude", "LLM evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "safetensors>=0.4",
  "mcp>=2.0,<3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
hf = ["transformers>=4.45", "tokenizers>=0.15", "huggingface-hub>=0.23"]
bench = ["pyarrow>=14", "huggingface-hub>=0.23"]
pdf = ["reportlab>=4.0"]
agent = ["anthropic>=2.7"]
video = ["playwright>=1.40", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.urls]
Homepage = "https://encore488.github.io/weight-space-manipulator/"
Leaderboard = "https://encore488.github.io/weight-space-manipulator/leaderboard.html"
Arena = "https://encore488.github.io/weight-space-manipulator/arena.html"
Repository = "https://github.com/encore488/weight-space-manipulator"
Issues = "https://github.com/encore488/weight-space-manipulator/issues"
Changelog = "https://github.com/encore488/weight-space-manipulator/blob/main/CHANGELOG.md"

[project.scripts]
wsp = "wsp_toolkit.cli:main"
wsp-mcp = "wsp_toolkit.mcp_server.server:main"

[tool.setuptools.dynamic]
version = { attr = "wsp_toolkit.__version__" }

[tool.setuptools.packages.find]
include = ["wsp_toolkit*"]

[tool.setuptools.package-data]
wsp_toolkit = ["ui/templates/*.html", "ui/static/*", "ui/static/fonts/*", "site/templates/*.html", "site/templates/*.css", "default_config.toml",
               "data/suites/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA GPU (skipped by default)",
  "download: needs network / large downloads (skipped by default)",
  "slow: takes more than ~30s on CPU",
]
addopts = "-m 'not gpu and not download' -q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
